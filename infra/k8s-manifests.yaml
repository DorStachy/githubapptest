# ─────────────────────────────────────────────────────────────
# Kubernetes manifests — INTENTIONALLY VULNERABLE for CodeFence.
#
# Covers: privileged containers, host networking, no resource limits,
#         secrets in plain text, no security context, writable root FS,
#         hostPath mounts, and SAFE counterparts.
# ─────────────────────────────────────────────────────────────

apiVersion: v1
kind: Namespace
metadata:
  name: vulnerable-app

---
# ═══════════════════════════════════════════════════════════════
# SECRET IN PLAIN TEXT (CRITICAL)
# ═══════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: vulnerable-app
type: Opaque
stringData:
  username: admin
  password: SuperSecretPassword123!
  connection_string: "postgres://admin:SuperSecretPassword123!@db:5432/prod"

---
# ═══════════════════════════════════════════════════════════════
# PRIVILEGED DEPLOYMENT (CRITICAL)
# ═══════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-app
  namespace: vulnerable-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-app
  template:
    metadata:
      labels:
        app: vulnerable-app
    spec:
      hostNetwork: true                    # HIGH: shares host network stack
      hostPID: true                        # HIGH: can see host processes
      containers:
        - name: app
          image: myregistry/app:latest     # MEDIUM: uses 'latest' tag
          securityContext:
            privileged: true               # CRITICAL: full host access
            runAsRoot: true
            allowPrivilegeEscalation: true  # HIGH
          ports:
            - containerPort: 80
          env:
            - name: DATABASE_URL           # HIGH: secret in env, not from Secret ref
              value: "postgres://admin:pass@db:5432/prod"
            - name: API_KEY
              value: "hardcoded-api-key-in-manifest"
          volumeMounts:
            - name: host-root
              mountPath: /host
            - name: docker-socket
              mountPath: /var/run/docker.sock  # CRITICAL: container escape
          # Missing: resources, readiness/liveness probes
      volumes:
        - name: host-root
          hostPath:
            path: /                        # CRITICAL: mounts entire host FS
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock

---
# ═══════════════════════════════════════════════════════════════
# SAFE DEPLOYMENT (no vulns)
# ═══════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safe-app
  namespace: vulnerable-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: safe-app
  template:
    metadata:
      labels:
        app: safe-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: myregistry/app@sha256:abc123def456  # pinned digest
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: connection_string
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20

---
# ═══════════════════════════════════════════════════════════════
# OVERLY PERMISSIVE RBAC (HIGH)
# ═══════════════════════════════════════════════════════════════
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: app-cluster-admin
subjects:
  - kind: ServiceAccount
    name: default
    namespace: vulnerable-app
roleRef:
  kind: ClusterRole
  name: cluster-admin           # CRITICAL: grants full cluster access
  apiGroup: rbac.authorization.k8s.io

---
# ═══════════════════════════════════════════════════════════════
# NETWORK POLICY — MISSING (entire namespace is open)
# In a real setup, absence of NetworkPolicy = all traffic allowed
# ═══════════════════════════════════════════════════════════════
