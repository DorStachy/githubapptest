name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # Vuln: overly broad write-all (zizmor should flag)
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

      # Vuln: using curl pipe bash pattern (zizmor should flag)
      - name: Install tooling
        run: |
          curl -sSL https://install.example.com | bash

      - name: Deploy
        # Vuln: using plain-text secret in env (zizmor should flag)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: echo "Deploying..."
