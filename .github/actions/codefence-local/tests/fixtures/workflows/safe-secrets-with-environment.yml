# SAFE: secrets properly gated with environment blocks
name: Release Pipeline (Safe)
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish to NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy
        run: aws deploy
        env:
          AWS_DEPLOY_KEY: ${{ secrets.AWS_DEPLOY_KEY }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint (only GITHUB_TOKEN, no env needed)
        run: echo "linting..."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
