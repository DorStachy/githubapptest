# UNSAFE: PR workflow writes to cache with shared key
# Paired with unsafe-cache-push-reader.yml for cross-workflow analysis
name: PR Build (Unsafe Cache)
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: deps-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            deps-

      - run: npm install
      - run: npm test
