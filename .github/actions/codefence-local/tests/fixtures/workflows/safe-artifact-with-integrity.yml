# SAFE: workflow_run downloads artifact WITH integrity verification
name: Deploy (Safe Artifact Download)
on:
  workflow_run:
    workflows: ["PR Build"]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/

      - name: Verify artifact integrity
        run: |
          cd dist/
          sha256sum --check checksums.sha256
          echo "Integrity verified"

      - name: Deploy
        run: npm run deploy
