# UNSAFE: PR workflow uploads artifact consumed by workflow_run
# Paired with unsafe-artifact-downloader.yml for cross-workflow analysis
name: PR Build (Artifact Uploader)
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install && npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
