# SAFE: Push workflow uses event-scoped cache key (no overlap with PR)
name: Deploy (Safe Cache)
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies (scoped by event)
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ github.event_name }}-deps-${{ hashFiles('**/package-lock.json') }}

      - run: npm run build
      - run: npm run deploy
